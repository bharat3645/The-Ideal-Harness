name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # max-parallel: 1 — the two legs both spawn a real headless Chrome for
      # test/web/browse/integration.test.ts. Running them concurrently on
      # shared GitHub-hosted runner infrastructure caused genuine resource
      # contention: one leg's Chrome daemon missed its 15s startup budget
      # (observed directly, 2026-08-19 — not a guess). Serializing costs wall
      # time but removes the contention outright, without touching the
      # daemon's timeout or any test code to paper over it.
      max-parallel: 1
      matrix:
        # Issue #9: engines.node previously declared ">=20" but CI only ever ran 22, so tsc
        # would silently accept APIs Node 20 doesn't have. Added a Node 20 leg to check —
        # it failed, confirming a real, pre-existing gap: `pnpm test` invokes
        # `node --test "dist-test/test/**/*.test.js"` (a glob string), and node --test's
        # native glob-pattern support only landed in Node 21 (commit 2839406, "ci: use Node
        # 22 (node --test glob support lands in Node 21)"). A directory-argument alternative
        # (`node --test dist-test/test`) was tried locally and does not reliably resolve as
        # a recursive scan either, so `engines.node` was corrected to ">=21" instead of
        # silently staying at ">=20" — matrix below tests the corrected floor (21) plus the
        # version this project has actually run on (22), both expected to pass for real.
        node-version: [21, 22]
    steps:
      # Pinned to immutable commit SHAs, not the mutable v4 tag -- see release.yml's
      # comment; same reasoning applies here even though this job has no publish token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      # Dogfood the substrate: validate every manifest + skill frontmatter.
      - run: node dist/core/cli/index.js validate .
      # Skill threat self-scan: every SKILL.md must pass the guard vetting gate.
      - run: |
          set -e
          for f in $(find skills -name SKILL.md); do
            echo "vetting $f"
            node dist/guard/cli/index.js vet "$f" > /dev/null
          done
