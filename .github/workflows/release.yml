name: Release

# Publish the ideal-harness package to npm when a v* tag is pushed.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      # This job holds NPM_TOKEN and publishes with provenance -- Actions pinned to
      # immutable commit SHAs (not a mutable tag) so a compromised upstream tag move
      # can't silently swap in different code for a job with real publish rights.
      # Bumped to each action's latest major 2026-08-19, same check as ci.yml -- see
      # decisions.md D042.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Gate the release on the same checks as CI.
      - run: pnpm biome
      - run: pnpm build
      - run: pnpm test
      - run: node dist/core/cli/index.js validate .
      # Publish the single package with npm provenance.
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
