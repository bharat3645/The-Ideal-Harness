name: Release

# Publish the ideal-harness package to npm when a v* tag is pushed.
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      # This job holds NPM_TOKEN and publishes with provenance -- Actions pinned to
      # immutable commit SHAs (not the mutable v4 tag) so a compromised upstream tag
      # move can't silently swap in different code for a job with real publish rights.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Gate the release on the same checks as CI.
      - run: pnpm biome
      - run: pnpm build
      - run: pnpm test
      - run: node dist/core/cli/index.js validate .
      # Publish the single package with npm provenance.
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
